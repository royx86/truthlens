[project]
name = "truthlens-backend"
version = "0.1.0"
description = "TruthLens – AI Social Media Fact-Checking & Verification Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "apify-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "groq>=0.11.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
